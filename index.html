<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomodoro Dashboard</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><small>PRODUCTIVITY</small><h1>Focus Dashboard</h1></div><button id="theme">Theme</button></header><section class="grid"><div class="card hero"><span id="mode">Focus</span><div id="time">25:00</div><div><button id="start">Start</button><button id="reset">Reset</button></div></div><div class="card"><h2>Today</h2><div class="stat"><b id="sessions">0</b><span>sessions</span></div><div class="stat"><b id="streak">0</b><span>day streak</span></div></div><div class="card wide"><h2>Tasks</h2><form id="form"><input id="task" placeholder="Add a task..." required><button>Add</button></form><ul id="list"></ul></div></section></main><script src="app.js"></script></body></html>
